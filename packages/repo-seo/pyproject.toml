[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-seo"
version = "0.1.0"
description = "GitHub 仓库 SEO 体检工具：输入仓库 URL，输出可发现性评分与逐条优化建议（评分模型 2.0）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
repo-seo = "repo_seo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_seo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
